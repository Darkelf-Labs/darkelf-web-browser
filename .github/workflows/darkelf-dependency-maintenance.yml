name: Darkelf Dependency Maintenance

on:
  schedule:
    - cron: "0 4 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  maintenance:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Update packages
        run: npm update

      - name: Audit
        run: npm audit --audit-level=high || true

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Commit updates
        uses: stefanzweifel/git-auto-commit-action@v6
        with:
          commit_message: "chore(deps): automatic weekly dependency update"
