name: Darkelf Dependency Maintenance

on:
  schedule:
    - cron: "0 4 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: deps-maintenance
  cancel-in-progress: false

jobs:
  maintenance:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install (clean)
        run: npm ci

      - name: Update dependencies
        run: |
          npm update
          npm install next@latest react@latest react-dom@latest

      - name: Refresh lockfile
        run: npm install --package-lock-only

      - name: Explain postcss dependency path
        run: npm ls postcss || true

      - name: Production audit (JSON)
        run: npm audit --omit=dev --json > audit.json || true

      - name: Print human-readable audit
        run: npm audit --omit=dev --audit-level=high || true

      - name: Count high/critical vulns
        id: vuln
        run: |
          node -e "const fs=require('fs'); const a=JSON.parse(fs.readFileSync('audit.json','utf8')); const m=(a.metadata&&a.metadata.vulnerabilities)||{}; const high=Number(m.high||0); const critical=Number(m.critical||0); console.log('high='+high); console.log('critical='+critical); fs.appendFileSync(process.env.GITHUB_OUTPUT,`high=${high}\ncritical=${critical}\n`);"

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Create Pull Request for dependency updates
        uses: peter-evans/create-pull-request@v7
        with:
          branch: chore/deps-weekly-update
          delete-branch: true
          title: "chore(deps): weekly dependency update"
          commit-message: "chore(deps): automatic weekly dependency update"
          body: |
            Automated weekly dependency maintenance.

            - Ran: npm update
            - Upgraded: next/react/react-dom to latest
            - Generated: production audit report

            High vulnerabilities: ${{ steps.vuln.outputs.high }}
            Critical vulnerabilities: ${{ steps.vuln.outputs.critical }}

            If high/critical remains, see attached audit output in workflow logs.
          labels: dependencies, automated

      - name: Open issue if high/critical vulnerabilities remain
        if: steps.vuln.outputs.high != '0' || steps.vuln.outputs.critical != '0'
        uses: peter-evans/create-issue-from-file@v5
        with:
          title: "Security follow-up: unresolved npm audit findings"
          content-filepath: audit.json
          labels: security, dependencies
