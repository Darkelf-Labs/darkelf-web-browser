
name: Darkelf Dependency Maintenance

on:
  schedule:
    # Every Monday at 06:00 UTC
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: darkelf-dependency-maintenance
  cancel-in-progress: false

jobs:
  dependency-maintenance:
    name: Update, validate, and open PR
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout Browser Repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Checkout Dependency Guardian
        uses: actions/checkout@v5
        with:
          repository: Darkelf-Labs/Darkelf-Dependency-Guardian
          ref: main
          path: .guardian-tool
          persist-credentials: false

      - name: Setup Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Install Dependency Guardian
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ./.guardian-tool
          guardian --help
          python -m pip show darkelf-dependency-guardian

      - name: Verify Browser Manifest
        run: |
          test -f package.json
          test -f package-lock.json

      - name: Install Current Dependencies
        run: npm ci

      - name: Validate Current Project
        run: guardian validate

      - name: Analyze Current Compatibility
        run: guardian compatibility

      - name: Review Safe Update Recommendations
        run: guardian update

      - name: Update Next.js and React
        run: |
          npm install next@latest react@latest react-dom@latest

      - name: Update Remaining Dependencies
        run: npm update

      - name: Verify Dependency Lockfile
        run: npm ci

      - name: Validate Updated Project
        run: guardian validate

      - name: Scan Updated Dependencies
        run: guardian scan

      - name: Analyze Updated Compatibility
        run: guardian compatibility

      - name: Check Dependency Health
        run: guardian doctor

      - name: Run Production Security Audit
        run: npm audit --omit=dev --audit-level=high

      - name: Check PostCSS Dependency Tree
        run: npm ls postcss

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Generate Guardian Reports
        if: always()
        run: guardian report

      - name: Upload Guardian Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: darkelf-dependency-maintenance-reports
          path: |
            .guardian/
            reports/
          if-no-files-found: warn
          retention-days: 30

      - name: Remove Temporary Guardian Checkout
        if: success()
        run: rm -rf .guardian-tool

      - name: Create Dependency Update PR
        if: success()
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.PAT }}

          commit-message: "chore(deps): automatic weekly dependency update"

          committer: "github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>"

          author: "Darkelf2024 <174353864+Darkelf2024@users.noreply.github.com>"

          signoff: false

          branch: "chore/weekly-dependency-maintenance"
          base: main
          delete-branch: false

          title: "chore(deps): automatic weekly dependency update"

          body: |
            ## Summary
            Automated weekly dependency maintenance for
            Darkelf Web Browser.

            ## Updates
            - Next.js
            - React and React DOM
            - Remaining npm dependencies
            - package-lock.json

            ## Darkelf Dependency Guardian
            - Project validation
            - Dependency scanning
            - Framework compatibility analysis
            - Dependency health checks
            - Safe update recommendations

            ## Additional Checks
            - Clean npm installation
            - Production npm security audit
            - PostCSS dependency tree
            - ESLint
            - Next.js production build

            All required checks must pass before this
            pull request is created.

            Review dependency changes before merging.

          labels: |
            dependencies
            automated
            maintenance

          add-paths: |
            package.json
            package-lock.json
