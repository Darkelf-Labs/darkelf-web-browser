name: Darkelf Dependency Maintenance

on:
  schedule:
    - cron: "0 4 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  maintenance:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies (clean)
        run: npm ci

      - name: Upgrade Next + React (security-sensitive path)
        run: npm install next@latest react@latest react-dom@latest

      - name: Update remaining packages
        run: npm update

      - name: Show postcss tree
        run: npm ls postcss || true

      - name: Audit (prod deps, non-blocking)
        run: npm audit --omit=dev --audit-level=high || true

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Commit updates
        uses: stefanzweifel/git-auto-commit-action@v6
        with:
          commit_message: "chore(deps): automatic weekly dependency update"
