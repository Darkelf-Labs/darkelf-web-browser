name: Darkelf Dependency Maintenance

on:
  schedule:
    # Weekly: Monday 06:00 UTC
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

# Prevent overlapping runs from racing each other
concurrency:
  group: darkelf-dependency-maintenance
  cancel-in-progress: false

jobs:
  dependency-maintenance:
    name: Update dependencies and open PR
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Update Next.js + React packages
        run: npm install next@latest react@latest react-dom@latest

      - name: Update remaining dependencies
        run: npm update

      - name: Show postcss dependency tree
        run: npm ls postcss || true

      - name: Run production audit (non-blocking)
        run: npm audit --omit=dev --audit-level=high || true

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Create dependency update PR
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "chore(deps): automatic weekly dependency update"
          committer: "github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>"
          author: "Darkelf2024 <174353864+Darkelf2024@users.noreply.github.com>"
          signoff: false

          # Dedicated long-lived automation branch (no direct push to main)
          branch: "chore/weekly-dependency-maintenance"
          base: "main"
          delete-branch: false

          title: "chore(deps): automatic weekly dependency update"
          body: |
            ## Summary
            This automated PR updates project dependencies on a weekly schedule.

            ## Changes
            - `npm install next@latest react@latest react-dom@latest`
            - `npm update`
            - Regenerated lockfile as needed

            ## Validation run in workflow
            - `npm run lint`
            - `npm run build`

            ## Notes
            - `npm audit --omit=dev --audit-level=high` is currently non-blocking in CI (`|| true`).
            - This PR is generated by GitHub Actions.

          labels: |
            dependencies
            automated
            maintenance

          add-paths: |
            package.json
            package-lock.json
