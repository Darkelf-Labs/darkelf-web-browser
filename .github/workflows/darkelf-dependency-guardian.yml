name: Darkelf Dependency Guardian

on:
  push:
    branches:
      - main
      - master
      - dev
  pull_request:
    branches:
      - main
      - master
      - dev
  workflow_dispatch:

permissions:
  contents: read

jobs:
  guardian:
    name: Dependency Compatibility Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Browser Repository
        uses: actions/checkout@v5

      - name: Checkout Guardian
        uses: actions/checkout@v5
        with:
          repository: Darkelf-Labs/Darkelf-Dependency-Guardian
          path: guardian

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install Guardian
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ./guardian

      - name: Verify Installation
        run: |
          guardian --help || python -m guardian --help || true

      - name: Validate Project
        run: guardian validate

      - name: Dependency Scan
        run: guardian scan

      - name: Compatibility Report
        run: guardian doctor

      - name: Safe Update Analysis
        run: guardian update
