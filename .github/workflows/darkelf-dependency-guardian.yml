
name: Darkelf Dependency Guardian

on:
  push:
    branches:
      - main
      - master
      - dev
    paths:
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/darkelf-dependency-guardian.yml"

  pull_request:
    branches:
      - main
      - master
      - dev

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dependency-guardian-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  guardian:
    name: Dependency Compatibility Scan
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout Browser Repository
        uses: actions/checkout@v5

      - name: Checkout Dependency Guardian
        uses: actions/checkout@v5
        with:
          repository: Darkelf-Labs/Darkelf-Dependency-Guardian
          ref: main
          path: guardian
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Install Dependency Guardian
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ./guardian

      - name: Verify Guardian Installation
        run: |
          guardian --help
          python -m pip show darkelf-dependency-guardian

      - name: Verify Browser Manifest
        run: |
          test -f package.json
          test -f package-lock.json
          node -e "const p=require('./package.json'); console.log('Project:',p.name); console.log('Version:',p.version)"

      - name: Install Browser Dependencies
        run: npm ci

      - name: Validate Project
        run: guardian validate

      - name: Dependency Scan
        run: guardian scan

      - name: Compatibility Analysis
        run: guardian compatibility

      - name: Dependency Health Check
        run: guardian doctor

      - name: Safe Update Analysis
        run: guardian update

      - name: Generate Guardian Report
        if: success() || failure()
        run: guardian report

      - name: Upload Guardian Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: darkelf-dependency-guardian-report
          path: |
            .guardian/
            reports/
          if-no-files-found: warn
          retention-days: 30
